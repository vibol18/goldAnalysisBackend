  dxy_correlation: {family: macro, weight: 1.1, min_timeframe: 1h, required_data: [dxy_df], description: "DXY inverse correlation"}
  us10y_correlation: {family: macro, weight: 1.0, min_timeframe: 1h, required_data: [us10y_df], description: "US10Y yield inverse correlation"}
  real_yield_proxy: {family: macro, weight: 0.9, min_timeframe: 15m, description: "Real yield proxy from nominal minus CPI"}
  risk_regime: {family: macro, weight: 0.6, min_timeframe: 15m, required_data: [spx_df], description: "SPX risk-on/risk-off context"}
  news_sentiment: {family: macro, weight: 0.7, min_timeframe: 1h, required_data: [news], description: "Gold news sentiment"}
