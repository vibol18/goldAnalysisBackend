  trendline: {family: classic, weight: 0.8, min_timeframe: 15m, description: "Pivot-anchored trendline"}
  channel: {family: classic, weight: 0.7, min_timeframe: 15m, description: "Parallel price channel"}
  breakout: {family: classic, weight: 1.1, min_timeframe: 15m, description: "Range breakout"}
  retest: {family: classic, weight: 0.9, min_timeframe: 15m, description: "Retest of a broken level"}
  ema_cross: {family: classic, weight: 1.0, min_timeframe: 15m, description: "EMA crossover"}
  price_vs_ema: {family: classic, weight: 0.7, min_timeframe: 15m, description: "Price relative to EMA stack"}
