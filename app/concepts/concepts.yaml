# Meas Pro concept registry.
# Every concept is a plugin: metadata here is declarative; detection lives in the
# family module wrapped by app.concepts.base.register. Fields:
#   family, description, enabled, weight, min_timeframe, regimes, sessions
# Empty regimes/sessions = allowed everywhere. Weights are cross-checked against
# concept_weights.yaml (the confluence scorer still reads that file).
defaults:
  enabled: true
  min_timeframe: 15m
  regimes: []
  sessions: []

concepts:
  # --- structure ---------------------------------------------------------
  swing_high: {family: structure, weight: 0.3, min_timeframe: 15m, description: "Causal confirmed swing high pivot"}
  swing_low: {family: structure, weight: 0.3, min_timeframe: 15m, description: "Causal confirmed swing low pivot"}
  trend: {family: structure, weight: 1.3, min_timeframe: 15m, description: "Higher-highs/higher-lows or lower-highs/lower-lows sequence"}
  bos: {family: structure, weight: 1.3, min_timeframe: 15m, description: "Break of structure"}
  choch: {family: structure, weight: 1.6, min_timeframe: 15m, description: "Change of character"}
  mss: {family: structure, weight: 1.8, min_timeframe: 15m, description: "Market structure shift with displacement"}
  internal_structure: {family: structure, weight: 0.6, min_timeframe: 15m, description: "Internal (lower timeframe) structure breaks"}
  external_structure: {family: structure, weight: 1.0, min_timeframe: 15m, description: "External (higher timeframe) structure breaks"}
  # --- smart money / ICT -------------------------------------------------
  fvg: {family: smc, weight: 1.4, min_timeframe: 15m, description: "Fair value gap / imbalance"}
  ifvg: {family: smc, weight: 1.5, min_timeframe: 15m, description: "Inverted fair value gap"}
  order_block: {family: smc, weight: 1.5, min_timeframe: 15m, description: "Bullish/bearish order block zone"}
  breaker_block: {family: smc, weight: 1.1, min_timeframe: 15m, description: "Broken order block flipped to opposition"}
  mitigation_block: {family: smc, weight: 0.8, min_timeframe: 15m, description: "Order block after a clear exit displacement"}
  equal_highs: {family: smc, weight: 0.7, min_timeframe: 15m, description: "Relative equal highs / buy-side liquidity"}
  equal_lows: {family: smc, weight: 0.7, min_timeframe: 15m, description: "Relative equal lows / sell-side liquidity"}
  liquidity_sweep: {family: smc, weight: 1.6, min_timeframe: 15m, description: "Stop run of a recorded liquidity level"}
  displacement: {family: smc, weight: 1.0, min_timeframe: 15m, description: "Large body with small wicks versus ATR"}
  killzone: {family: smc, weight: 0.5, min_timeframe: 15m, description: "London/New York killzone context"}
  power_of_three: {family: smc, weight: 0.8, min_timeframe: 15m, description: "Accumulation-manipulation-distribution per day"}
  judas_swing: {family: smc, weight: 0.9, min_timeframe: 15m, description: "False break of the day open before reversal"}
  premium_discount: {family: smc, weight: 1.2, min_timeframe: 15m, description: "Dealing range premium/discount location"}
  ote: {family: smc, weight: 1.0, min_timeframe: 15m, description: "Optimal trade entry 62-79% retracement"}
  dealing_range: {family: smc, weight: 0.5, min_timeframe: 15m, description: "Active higher-timeframe dealing range"}
  daily_open: {family: smc, weight: 0.3, min_timeframe: 15m, description: "Daily open reference"}
  midnight_open: {family: smc, weight: 0.3, min_timeframe: 15m, description: "Midnight open reference"}
  pdh: {family: smc, weight: 0.5, min_timeframe: 15m, description: "Previous day high liquidity"}
  pdl: {family: smc, weight: 0.5, min_timeframe: 15m, description: "Previous day low liquidity"}
  pwh: {family: smc, weight: 0.6, min_timeframe: 15m, description: "Previous week high liquidity"}
  pwl: {family: smc, weight: 0.6, min_timeframe: 15m, description: "Previous week low liquidity"}
  session_high: {family: smc, weight: 0.4, min_timeframe: 15m, description: "Session high liquidity"}
  session_low: {family: smc, weight: 0.4, min_timeframe: 15m, description: "Session low liquidity"}
  smt_divergence: {family: smc, weight: 1.2, min_timeframe: 1h, required_data: [dxy_df], description: "SMT divergence versus DXY"}
  # --- classic -----------------------------------------------------------
  sr_zone: {family: classic, weight: 0.9, min_timeframe: 15m, description: "Support/resistance zone from pivots"}
