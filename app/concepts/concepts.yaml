  bollinger_expansion: {family: classic, weight: 0.6, min_timeframe: 15m, description: "Bollinger band expansion"}
  atr_volatility: {family: classic, weight: 0.2, min_timeframe: 15m, description: "ATR volatility regime"}
  adx_trend_strength: {family: classic, weight: 0.6, min_timeframe: 15m, description: "ADX trend strength"}
  fibonacci: {family: classic, weight: 0.6, min_timeframe: 15m, description: "Fibonacci retracement levels"}
  pivot_points: {family: classic, weight: 0.5, min_timeframe: 15m, description: "Daily pivot points"}
  vwap: {family: classic, weight: 0.6, min_timeframe: 15m, description: "Session VWAP"}
  anchored_vwap: {family: classic, weight: 0.7, min_timeframe: 15m, description: "Anchored VWAP from a pivot"}
  volume_profile: {family: classic, weight: 0.6, min_timeframe: 15m, description: "Rolling volume profile POC/value area"}
  ichimoku: {family: classic, weight: 0.6, min_timeframe: 1h, description: "Ichimoku cloud state"}
  market_regime: {family: classic, weight: 1.1, min_timeframe: 15m, description: "Trending/ranging regime classification"}
  # --- price action ------------------------------------------------------
