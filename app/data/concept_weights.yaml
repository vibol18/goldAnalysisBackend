# Meas Pro concept weights — edit freely, restart the backend to apply.
# Weight = base contribution of a concept before strength scaling and recency decay.
# Category caps stop one indicator family from dominating the confluence score.

settings:
  recency_bars: 24
  min_recency: 0.2
  score_buy_threshold: 0.18
  score_sell_threshold: -0.18
  min_grade_a_categories: 3
  min_aplus_categories: 4
  min_rr: 1.5
  choppy_regimes: [ranging, volatile, neutral]
  max_event_risk: 70
  max_atr_pct: 3.5
  max_spread_atr_ratio: 0.25
  ml_blend: 0.35

category_caps:
  structure: 3.2
  smc: 3.6
  classic: 2.4
  price_action: 1.8
  mtf: 3.0
  macro: 2.2
  advanced: 1.4

